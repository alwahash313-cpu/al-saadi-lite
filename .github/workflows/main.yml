name: إنشاء ملف APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          mkdir -p flutter_project
          unzip -o al_saadi_lite_cloud_v17.zip -d flutter_project

      - name: تحديد المشروع
        run: |
          PROJECT_DIR=$(dirname "$(find flutter_project -name pubspec.yaml -type f | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable

      - name: إصلاح الملفات
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/store.list()/store.load()/g' lib/main.dart
          sed -i 's/&#91;/[/g; s/&#93;/]/g' lib/main.dart
          grep -q "import 'dart:async';" lib/main.dart || sed -i "1i import 'dart:async';" lib/main.dart

      - name: جلب الحزم
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: فحص المشروع
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: بناء APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
