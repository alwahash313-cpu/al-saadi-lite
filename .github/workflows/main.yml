name: فحص مشروع السعدي

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          rm -rf flutter_project
          mkdir flutter_project
          unzip -o al_saadi_lite_cloud_v17.zip -d flutter_project

      - name: العثور على مشروع Flutter
        run: |
          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "المشروع موجود في: $PROJECT_DIR"

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: جلب الحزم
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: البحث عن ProjectStore
        run: |
          echo "===== ملفات المشروع ====="
          find . -type f -name "*.dart" -print

          echo "===== أماكن ProjectStore ====="
          grep -Rni "class ProjectStore" . --include="*.dart" || true

          echo "===== أماكن الدوال داخل project_store ====="
          find . -type f -name "project_store.dart" -print -exec sh -c 'echo "===== $1 ====="; nl -ba "$1"; echo "===== نهاية الملف ====="' _ {} \;

      - name: عرض بداية main.dart
        run: |
          echo "===== main.dart من 1 إلى 160 ====="
          nl -ba lib/main.dart | sed -n '1,160p'
          echo "===== نهاية الجزء ====="
        working-directory: ${{ env.PROJECT_DIR }}

      - name: فحص المشروع
        run: flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}

      - name: بناء APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
