name: إنشاء ملف APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          rm -rf flutter_project
          mkdir flutter_project
          unzip -o al_saadi_lite_cloud_v17.zip -d flutter_project

      - name: العثور على مشروع Flutter
        run: |
          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "المشروع موجود في: $PROJECT_DIR"

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: جلب الحزم
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: إصلاح main.dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/main.dart'); t=p.read_text(encoding='utf-8'); t=t.replace('&#91;','[').replace('&#93;',']'); t=t.replace('future: store.list(),','future: store.load(),'); t='import \\'dart:async\\';\\n'+t if 'import \\'dart:async\\';' not in t else t; p.write_text(t,encoding='utf-8'); print('تم تنظيف main.dart')"

      - name: إصلاح دالة المشاريع
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/main.dart'); t=p.read_text(encoding='utf-8'); s=t.find('  Widget _projects() =>'); e=t.find('\\nclass LiteEditor',s); r='''  Widget _projects() => FutureBuilder<List<EditorProject>>(\\n    future: store.load(),\\n    builder: (context, snap) {\\n      final items = snap.data ?? <EditorProject>[];\\n      return ListView(\\n        padding: const EdgeInsets.all(18),\\n        children: [\\n          const Text(\\n            'مشاريعي',\\n            textAlign: TextAlign.right,\\n            style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold),\\n          ),\\n          const SizedBox(height: 16),\\n          if (items.isEmpty)\\n            const Padding(\\n              padding: EdgeInsets.all(30),\\n              child: Text(\\n                'ماكو مشاريع محفوظة بعد.',\\n                textAlign: TextAlign.center,\\n                style: TextStyle(color: Colors.white54),\\n              ),\\n            ),\\n          ...items.map((p) => Card(\\n            child: ListTile(\\n              title: Text(p.name, textAlign: TextAlign.right),\\n              subtitle: Text('${p.clips.length} مقطع', textAlign: TextAlign.right),\\n              trailing: const Icon(Icons.movie_outlined),\\n              onTap: () {\\n                Navigator.push(\\n                  context,\\n                  MaterialPageRoute(\\n                    builder: (_) => LiteEditor(project: p, store: store),\\n                  ),\\n                );\\n              },\\n            ),\\n          )),\\n        ],\\n      );\\n    },\\n  );\\n\\n'''; assert s>=0 and e>=0; p.write_text(t[:s]+r+t[e:],encoding='utf-8'); print('تم إصلاح _projects')"

      - name: فحص المشروع
        run: flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}

      - name: بناء APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
