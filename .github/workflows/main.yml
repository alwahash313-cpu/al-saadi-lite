name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in the repository root"
            exit 1
          fi
          if [ ! -f MainActivity.kt ] || [ ! -f AndroidManifest.xml ]; then
            echo "ERROR: upload MainActivity.kt and AndroidManifest.xml to the repository root"
            exit 1
          fi

      - name: Create assets folder
        run: mkdir -p assets && touch assets/.gitkeep

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name=al_saadi_lite .

      - name: Apply native media code
        run: |
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/alsaadi/app
          cp MainActivity.kt android/app/src/main/kotlin/com/alsaadi/app/MainActivity.kt
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/com\.example\.al_saadi_lite/com.alsaadi.app/g' android/app/build.gradle*
          grep -n "com.alsaadi.app" android/app/build.gradle*

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-saadi-lite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
