name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Check project files
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          echo "::notice::FILES: $(ls | tr '\n' ' ')"
          for f in pubspec.yaml AndroidManifest.xml MainActivity.kt main_v6.dart native_media_engine_v2.dart splash_assets_v3.dart tayoub_v5.zip; do
            if [ ! -f "$f" ]; then
              echo "::error::MISSING FILE: $f"
              exit 1
            fi
          done
          grep -q mixMusic MainActivity.kt || { echo "::error::MainActivity.kt is the OLD version"; exit 1; }
          grep -q MediaApi main_v6.dart || { echo "::error::main_v6.dart is wrong"; exit 1; }

      - name: Unpack app package
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          mkdir -p pkg
          unzip -q -o tayoub_v5.zip -d pkg || echo "::warning::tayoub_v5.zip could not be unpacked"
          ls -R pkg | head -40 || true

      - name: Apply Dart updates
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          mkdir -p lib assets
          touch assets/.gitkeep
          cp main_v6.dart lib/main.dart
          cp splash_assets_v3.dart lib/splash_assets.dart
          cp native_media_engine_v2.dart lib/native_media_engine.dart

      - name: Patch video player diagnostics
        run: |
          cat > patch_player.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()

          def rep(old, new, name):
              global s
              if s.count(old) == 1:
                  s = s.replace(old, new)
                  print('patched: ' + name)
              else:
                  print('::warning::patch not applied: ' + name)

          rep("      await c.initialize().timeout(const Duration(seconds: 20));\n",
              "      await c.initialize().timeout(const Duration(seconds: 20));\n      c.addListener(_onTick);\n",
              'listener')

          rep("  void dispose() { controller?.dispose(); progressSub?.cancel(); super.dispose(); }\n",
              "  void dispose() { controller?.dispose(); progressSub?.cancel(); super.dispose(); }\n"
              "\n"
              "  void _onTick() {\n"
              "    final c = controller;\n"
              "    if (c == null || !mounted) return;\n"
              "    if (c.value.hasError && loadError == null) {\n"
              "      setState(() => loadError = 'خطأ أثناء التشغيل: ${c.value.errorDescription}');\n"
              "    } else {\n"
              "      setState(() {});\n"
              "    }\n"
              "  }\n"
              "\n"
              "  Future<void> _togglePlay() async {\n"
              "    final c = controller;\n"
              "    if (c == null) return;\n"
              "    try {\n"
              "      if (c.value.isPlaying) {\n"
              "        await c.pause();\n"
              "      } else {\n"
              "        await c.setVolume(1.0);\n"
              "        await c.play();\n"
              "      }\n"
              "    } catch (e) { _msg('تعذر التشغيل: $e'); }\n"
              "  }\n",
              'methods')

          rep("        if (controller != null) IconButton(icon: Icon(controller!.value.isPlaying ? Icons.pause : Icons.play_arrow), onPressed: () { setState(() { controller!.value.isPlaying ? controller!.pause() : controller!.play(); }); }),\n",
              "        if (controller != null) IconButton(icon: Icon(controller!.value.isPlaying ? Icons.pause : Icons.play_arrow), onPressed: _togglePlay),\n"
              "        if (controller != null) Text('المشغل: ${controller!.value.isPlaying ? \"يعمل\" : \"متوقف\"} | ${controller!.value.position.inSeconds}/${controller!.value.duration.inSeconds} ث | تخزين مؤقت: ${controller!.value.isBuffering ? \"نعم\" : \"لا\"} | ${controller!.value.hasError ? \"خطأ: ${controller!.value.errorDescription}\" : \"بدون خطأ\"}', textAlign: TextAlign.center, style: const TextStyle(fontSize: 11, color: Colors.white54)),\n",
              'button')

          open(p, 'w', encoding='utf-8').write(s)
          PYEOF
          python3 patch_player.py lib/main.dart

      - name: Recreate Android folder
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          rm -rf android
          flutter create --platforms=android --org com.example --project-name=al_saadi_lite .

      - name: Apply native media code
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/alsaadi/app
          cp MainActivity.kt android/app/src/main/kotlin/com/alsaadi/app/MainActivity.kt
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/com\.example\.al_saadi_lite/com.alsaadi.app/g' android/app/build.gradle*
          grep -n "com.alsaadi.app" android/app/build.gradle* || true
          sed -i 's/Theme.Light.NoTitleBar/Theme.Black.NoTitleBar/g' android/app/src/main/res/values/styles.xml || true

      - name: Apply app icon and name
        run: |
          trap 'echo "::error::FAILED: $BASH_COMMAND"' ERR
          if [ -d pkg/res ]; then
            cp -r pkg/
