      - name: إصلاح الملفات
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")
          text = p.read_text(encoding="utf-8")

          # إصلاح رموز HTML إن وجدت
          text = text.replace("&#91;", "[")
          text = text.replace("&#93;", "]")

          # إصلاح اسم الدالة
          text = text.replace(
              "future: store.list(),",
              "future: store.load(),"
          )

          # إضافة dart:async
          if "import 'dart:async';" not in text:
              text = "import 'dart:async';\n" + text

          # استبدال _projects() بالكامل
          start = text.find("  Widget _projects() =>")
          end = text.find("\nclass LiteEditor", start)

          if start == -1 or end == -1:
              raise SystemExit("لم يتم العثور على دالة _projects")

          new_code = """  Widget _projects() => FutureBuilder<List<EditorProject>>(
    future: store.load(),
    builder: (context, snap) {
      final items = snap.data ?? <EditorProject>[];

      return ListView(
        padding: const EdgeInsets.all(18),
        children: [
          const Text(
            'مشاريعي',
            textAlign: TextAlign.right,
            style: TextStyle(
              fontSize: 26,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 16),
          if (items.isEmpty)
            const Padding(
              padding: EdgeInsets.all(30),
              child: Text(
                'ماكو مشاريع محفوظة بعد.',
                textAlign: TextAlign.center,
                style: TextStyle(
                  color: Colors.white54,
                ),
              ),
            ),
          ...items.map(
            (p) => Card(
              child: ListTile(
                title: Text(
                  p.name,
                  textAlign: TextAlign.right,
                ),
                subtitle: Text(
                  '${p.clips.length} مقطع',
                  textAlign: TextAlign.right,
                ),
                trailing: const Icon(Icons.movie_outlined),
                onTap: () {
                  Navigator.push(
                    context,
                    MaterialPageRoute(
                      builder: (_) => LiteEditor(
                        project: p,
                        store: store,
                      ),
                    ),
                  );
                },
              ),
            ),
          ),
        ],
      );
    },
  );

"""

          text = text[:start] + new_code + text[end:]
          p.write_text(text, encoding="utf-8")

          print("تم إصلاح main.dart")
          PY
