name: Build Flutter APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Find Flutter project
    id: project
    run: |
      FILE=$(find . -name pubspec.yaml -not -path './.git/*' -print -quit)
      if [ -z "$FILE" ]; then
        echo "ERROR: pubspec.yaml not found"
        exit 1
      fi
      echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.35.2'
      channel: stable
      cache: true

  - name: Install dependencies
    working-directory: ${{ steps.project.outputs.dir }}
    run: flutter pub get

  - name: Check project
    working-directory: ${{ steps.project.outputs.dir }}
    run: flutter analyze

  - name: Build APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: al-saadi-lite-apk
      path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
