name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: البحث عن مشروع Flutter
        run: |
          echo "البحث عن pubspec.yaml..."
          find . -name pubspec.yaml -print

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: جلب الحزم
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Flutter project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: فحص المشروع
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter analyze

      - name: بناء APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: al-saadi-lite-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
