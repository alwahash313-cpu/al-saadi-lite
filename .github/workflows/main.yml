name: إنشاء ملف APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          rm -rf flutter_project
          mkdir flutter_project
          unzip -o al_saadi_lite_cloud_v17.zip -d flutter_project

      - name: العثور على مشروع Flutter
        run: |
          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "المشروع موجود في: $PROJECT_DIR"

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: جلب الحزم
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: إصلاح main.dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text(encoding="utf-8")

          if "import 'dart:async';" not in text:
              text = "import 'dart:async';\n" + text

          text = text.replace(
              "future: store.list(),",
              "future: store.load(),"
          )

          start = text.find("  Widget _projects() =>")
          end = text.find("\nclass LiteEditor", start)

          if start == -1:
              raise SystemExit("لم يتم العثور على _projects")

          if end == -1:
              raise SystemExit("لم يتم العثور على class LiteEditor")

          new_projects = r"""  Widget _projects() => FutureBuilder<List<EditorProject>>(
    future: store.load(),
    builder: (context, snap) {
      final items = snap.data ?? <EditorProject>[];

      return ListView(
        padding: const EdgeInsets.all(18),
        children: [
          const Text(
            'مشاريعي',
            textAlign: TextAlign.right,
            style: TextStyle(
              fontSize: 26,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 16),
          if (items.isEmpty)
            const Padding(
              padding: EdgeInsets.all(30),
              child: Text(
                'ماكو مشاريع محفوظة بعد.',
                textAlign: TextAlign.center,
                style: TextStyle(
                  color: Colors.white54,
                ),
              ),
            ),
          ...items.map(
            (p) => Card(
              child: ListTile(
                title: Text(
                  p.name,
                  textAlign: TextAlign.right,
                ),
                subtitle: Text(
                  '${p.clips.length} مقطع',
                  textAlign: TextAlign.right,
                ),
                trailing: const Icon(
                  Icons.movie_outlined,
                ),
                onTap: () {
                  Navigator.push(
                    context,
                    MaterialPageRoute(
                      builder: (_) => LiteEditor(
                        project: p,
                        store: store,
                      ),
                    ),
                  );
                },
              ),
            ),
          ),
        ],
      );
    },
  );

"""

          text = text[:start] + new_projects + text[end:]

          path.write_text(text, encoding="utf-8")

          print("تم استبدال _projects بالكامل")
          PY

      - name: فحص المشروع
        run: flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}

      - name: بناء APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
