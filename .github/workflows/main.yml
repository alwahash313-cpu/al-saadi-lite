name: Inspect Flutter Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q al_saadi_lite_cloud_v17.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Inspect project
        run: |
          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          echo "=== Android files ==="
          find "$PROJECT_DIR/android" -maxdepth 4 -type f 2>/dev/null | sort

      - name: Check pubspec
        run: |
          echo "=== pubspec.yaml ==="
          cat "$PROJECT_DIR/pubspec.yaml"
