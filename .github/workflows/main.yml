name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"

      - name: التحقق من Flutter
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter --version

      - name: جلب الحزم
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: فحص المشروع
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: بناء APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: al-saadi-lite-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
