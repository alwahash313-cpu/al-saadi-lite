name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Check project files
        run: |
          echo "::notice::FILES: $(ls | tr '\n' ' ')"
          find . -maxdepth 1 -name 'main_v*.zip' -exec unzip -o -q {} \;
          find . -maxdepth 1 -name 'main_v*.txt' -exec sh -c 'cp "$1" "${1%.txt}.dart"' _ {} \;
          test -f v19.patch && { patch -l -s main_v17.dart -o main_v19.dart < v19.patch || { echo "::error::v19.patch failed to apply"; exit 1; }; }
          test -f ma.patch && { patch -l --dry-run -s MainActivity.kt < ma.patch && patch -l -s MainActivity.kt < ma.patch || echo "::warning::ma.patch skipped"; }
          MAIN=$(ls main_v*.dart 2>/dev/null | sort -V | tail -n 1)
          test -n "$MAIN" || { echo "::error::MISSING FILE: main_vN.dart"; exit 1; }
          echo "MAIN=$MAIN" >> "$GITHUB_ENV"
          echo "::notice::USING MAIN FILE: $MAIN"
          test -f pubspec.yaml || { echo "::error::MISSING FILE: pubspec.yaml"; exit 1; }
          test -f AndroidManifest.xml || { echo "::error::MISSING FILE: AndroidManifest.xml"; exit 1; }
          test -f MainActivity.kt || { echo "::error::MISSING FILE: MainActivity.kt"; exit 1; }
          test -f native_media_engine_v2.dart || { echo "::error::MISSING FILE: native_media_engine_v2.dart"; exit 1; }
          test -f splash_assets_v3.dart || { echo "::error::MISSING FILE: splash_assets_v3.dart"; exit 1; }
          test -f tayoub_v5.zip || { echo "::error::MISSING FILE: tayoub_v5.zip"; exit 1; }
          grep -q mixMusic MainActivity.kt || { echo "::error::MainActivity.kt is the OLD version"; exit 1; }
          grep -q MediaApi "$MAIN" || { echo "::error::$MAIN is wrong"; exit 1; }

      - name: Unpack app package
        run: |
          mkdir -p pkg
          unzip -q -o tayoub_v5.zip -d pkg || echo "::warning::tayoub_v5.zip could not be unpacked"
          ls -R pkg | head -40 || true

      - name: Apply Dart updates
        run: |
          mkdir -p lib assets
          touch assets/.gitkeep
          cp "$MAIN" lib/main.dart
          cp splash_assets_v3.dart lib/splash_assets.dart
          cp native_media_engine_v2.dart lib/native_media_engine.dart

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example --project-name=al_saadi_lite .

      - name: Apply native media code
        run: |
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/alsaadi/app
          cp MainActivity.kt android/app/src/main/kotlin/com/alsaadi/app/MainActivity.kt
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/com\.example\.al_saadi_lite/com.alsaadi.app/g' android/app/build.gradle*
          grep -n "com.alsaadi.app" android/app/build.gradle* || true
          sed -i 's/Theme.Light.NoTitleBar/Theme.Black.NoTitleBar/g' android/app/src/main/res/values/styles.xml || true

      - name: Apply app icon and name
        run: |
          test -d pkg/res && cp -r pkg/res/. android/app/src/main/res/ || echo "::warning::pkg/res not found, default icon used"
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-ar
          cat > android/app/src/main/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Tayoub</string>
          </resources>
          XML
          cat > android/app/src/main/res/values-ar/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">طيوب</string>
          </resources>
          XML
          sed -i 's#android:label="[^"]*"#android:label="@string/app_name"#' android/app/src/main/AndroidManifest.xml
          grep -n "android:label" android/app/src/main/AndroidManifest.xml || true
          ls android/app/src/main/res/mipmap-anydpi-v26 || true

      - name: Disable Impeller (video rendering fix)
        run: |
          sed -i 's#</application>#<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -n "EnableImpeller" android/app/src/main/AndroidManifest.xml || echo "::warning::Impeller flag not added"

      - name: Allow internet (AI features)
        run: |
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><application#' android/app/src/main/AndroidManifest.xml
          grep -n "permission.INTERNET" android/app/src/main/AndroidManifest.xml || echo "::warning::INTERNET not added"

      - name: Add Media3 dependencies
        run: |
          cat >> android/app/build.gradle.kts <<'GRADLE'

          dependencies {
              implementation("androidx.media3:media3-common:1.4.1")
              implementation("androidx.media3:media3-effect:1.4.1")
              implementation("androidx.media3:media3-transformer:1.4.1")
          }

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          GRADLE
          tail -n 18 android/app/build.gradle.kts

      - name: Add share plugin
        run: |
          flutter pub add share_plus:^10.1.4

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || { echo "::error::BUILD FAILED: $(grep -E 'Error|error:|FAILED|e: ' build.log | head -6 | tr '\n' ' ')"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-saadi-lite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
