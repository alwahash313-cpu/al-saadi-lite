name: إنشاء ملف APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          unzip -o al_saadi_lite_cloud_v17.zip -d flutter_project

      - name: العثور على مشروع Flutter
        run: |
          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "لم يتم العثور على pubspec.yaml"
            exit 1
          fi

          echo "مشروع Flutter موجود في: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: جلب الحزم
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: فحص المشروع
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: بناء APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
